[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-dump-gateway"
version = "0.3.0"
description = "Account and catalog gateway for Knowledge Dump"
requires-python = ">=3.10"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
spaces = ["boto3>=1.40,<2"]

[project.scripts]
knowledge-dump-gateway = "apps.gateway.knowledge_dump_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.gateway.knowledge_dump_gateway*"]
